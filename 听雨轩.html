<title>雨落诗笺 · 听雨轩</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap');

:root {
  --paper: #f5f0e6;
  --paper-dark: #e8e0d0;
  --ink: #3d3229;
  --ink-light: #6b5e4f;
  --accent: #8b4513;
  --accent-light: #a0522d;
  --gold: #b8860b;
  --red: #8b0000;
  --green: #2e5a2e;
  --border: #c4b9a8;
  --seal-red: #c83c23;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Serif SC', 'SimSun', serif;
  background: linear-gradient(135deg, #e8e0d0 0%, #f5f0e6 50%, #e8e0d0 100%);
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
}

/* 纸张纹理 */
.paper {
  max-width: 720px;
  margin: 20px auto;
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 4px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08), inset 0 0 60px rgba(139,69,19,0.03);
  padding: 40px 32px;
  position: relative;
}

.paper::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 31px,
    rgba(139,69,19,0.04) 31px,
    rgba(139,69,19,0.04) 32px
  );
  pointer-events: none;
  border-radius: 4px;
}

/* 标题 */
h1 {
  text-align: center;
  font-size: 2em;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 8px;
  letter-spacing: 0.15em;
}

.subtitle {
  text-align: center;
  color: var(--ink-light);
  font-size: 0.9em;
  margin-bottom: 24px;
}

/* 分隔线 */
.divider {
  text-align: center;
  color: var(--border);
  margin: 16px 0;
  font-size: 1.1em;
  letter-spacing: 0.5em;
}

/* 打字机文本 */
.type-text {
  line-height: 2;
  font-size: 1.05em;
  min-height: 1.5em;
}

/* 按钮 */
.btn-group {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 20px 0;
}

.btn {
  font-family: inherit;
  font-size: 1em;
  padding: 12px 20px;
  border: 1px solid var(--border);
  background: linear-gradient(to bottom, #faf6f0, #f0ebe0);
  color: var(--ink);
  cursor: pointer;
  border-radius: 3px;
  transition: all 0.2s;
  text-align: left;
  position: relative;
  overflow: hidden;
}

.btn:hover {
  background: linear-gradient(to bottom, #fff, #f5f0e6);
  border-color: var(--accent-light);
  transform: translateX(4px);
}

.btn:active {
  transform: translateX(2px);
}

.btn-primary {
  background: linear-gradient(to bottom, var(--accent-light), var(--accent));
  color: #fff;
  border-color: var(--accent);
}

.btn-primary:hover {
  background: linear-gradient(to bottom, #a0522d, #8b4513);
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

/* 输入框 */
.input-line {
  display: flex;
  gap: 10px;
  margin: 16px 0;
  align-items: center;
}

.input-line input {
  flex: 1;
  font-family: inherit;
  font-size: 1em;
  padding: 10px 14px;
  border: 1px solid var(--border);
  background: #faf6f0;
  color: var(--ink);
  border-radius: 3px;
  outline: none;
}

.input-line input:focus {
  border-color: var(--accent-light);
}

/* 状态栏 */
.status-bar {
  background: rgba(139,69,19,0.06);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 12px 16px;
  margin: 12px 0;
  font-size: 0.9em;
  line-height: 1.8;
}

/* 诗句展示 */
.poem-line {
  font-size: 1.15em;
  color: var(--accent);
  margin: 8px 0;
  padding-left: 12px;
  border-left: 3px solid var(--accent-light);
}

/* 关键字下划线 */
.keyword {
  text-decoration: underline;
  text-decoration-style: wavy;
  text-decoration-color: var(--red);
  font-weight: 600;
}

/* 对错反馈 */
.correct { color: var(--green); font-weight: 600; }
.wrong { color: var(--red); font-weight: 600; }

/* 锦囊标签 */
.tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 2px;
  font-size: 0.85em;
  margin-right: 6px;
}

.tag-jin { background: rgba(184,134,11,0.15); color: var(--gold); border: 1px solid var(--gold); }

/* 隐藏 */
.hidden { display: none !important; }

/* 动画 */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.fade-in {
  animation: fadeIn 0.4s ease-out;
}

/* 滚动条美化 */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--paper-dark); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* 时辰签 */
.time-sign {
  text-align: center;
  color: var(--gold);
  font-size: 0.95em;
  margin-bottom: 12px;
}

/* 锁图标 */
.locked { opacity: 0.5; }
.lock-icon::before { content: '🔒 '; }

/* 分数展示 */
.score-big {
  font-size: 2em;
  text-align: center;
  color: var(--accent);
  margin: 16px 0;
}

/* NPC对话 */
.npc-talk {
  background: rgba(139,69,19,0.04);
  padding: 12px 16px;
  border-radius: 3px;
  margin: 10px 0;
  font-style: italic;
  color: var(--ink-light);
}

/* 响应式 */
@media (max-width: 600px) {
  .paper { margin: 10px; padding: 24px 16px; }
  h1 { font-size: 1.5em; }
}

/* 作者印章 - 朱红双层 */
.author-seal {
  display: inline-block;
  border: 2px solid var(--seal-red);
  color: var(--seal-red);
  background: rgba(200, 60, 35, 0.04);
  padding: 6px 14px;
  font-size: 0.9em;
  font-weight: 700;
  letter-spacing: 0.15em;
  margin: 8px auto 16px;
  position: relative;
  line-height: 1.4;
}

.author-seal::before {
  content: '';
  position: absolute;
  top: -4px; left: -4px; right: -4px; bottom: -4px;
  border: 1px solid rgba(200, 60, 35, 0.35);
  pointer-events: none;
}

.seal-wrap {
  text-align: center;
  margin-bottom: 8px;
}

.author-footer {
  text-align: center;
  margin-top: 30px;
  padding-top: 16px;
  border-top: 1px dashed var(--border);
  font-size: 0.85em;
  color: var(--ink-light);
}
</style>

// 创建按钮组，返回Promise<index>
function showButtons(labels, options={}) {
  return new Promise(resolve => {
    const group = document.createElement('div');
    group.className = 'btn-group fade-in';
    if (options.id) group.id = options.id;

    labels.forEach((label, i) => {
      const btn = document.createElement('button');
      btn.className = 'btn' + (options.primary===i?' btn-primary':'');
      btn.textContent = label;
      btn.onclick = () => {
        group.remove();
        resolve(i);
      };
      group.appendChild(btn);
    });
    $('content').appendChild(group);
    if (options.autoFocus !== false) {
      setTimeout(()=>group.querySelector('button')?.focus(), 50);
    }
  });
}

// 输入框
function showInput(promptText) {
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'input-line fade-in';

    const span = document.createElement('span');
    span.textContent = promptText || '▶ ';
    wrap.appendChild(span);

    const input = document.createElement('input');
    input.type = 'text';
    input.autocomplete = 'off';
    wrap.appendChild(input);

    const btn = document.createElement('button');
    btn.className = 'btn btn-primary';
    btn.textContent = '确认';
    btn.onclick = () => { wrap.remove(); resolve(input.value.trim()); };
    wrap.appendChild(btn);

    input.onkeydown = (e) => { if (e.key==='Enter') btn.click(); };

    $('content').appendChild(wrap);
    setTimeout(()=>input.focus(), 50);
  });
}

// ==================== 核心逻辑 ====================
function 模糊匹配(用户输入, 标准答案, 阈值=0.6) {
  const m=用户输入.length, n=标准答案.length;
  if (m===0 || n===0) return false;
  const dp=Array(m+1).fill(0).map(()=>Array(n+1).fill(0));
  for (let i=1;i<=m;i++) for (let j=1;j<=n;j++) {
    dp[i][j] = 用户输入[i-1]===标准答案[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j],dp[i][j-1]);
  }
  return dp[m][n]/Math.max(m,n) >= 阈值;
}

function 检查答案(用户输入, 标准答案列表, 反义词) {
  用户输入 = 用户输入.trim();
  if (!用户输入 || 用户输入.length<2) return '错';
  for (let 答案 of 标准答案列表) {
    if (答案.includes(用户输入) || 用户输入.includes(答案)) return '对';
    if (模糊匹配(用户输入, 答案)) return '对';
  }
  if (用户输入.includes(反义词) && 用户输入.length>4) return '对';
  return '错';
}

// ==================== 文字雅戏（单人闯关） ====================
async function 文字游戏() {
  clearContent();
  addText('凭轩听雨 · 文字雅戏', 'subtitle');
  await typeWrite('方才听雨，今来试才。');
  await typeWrite('吾出一诗，隐其一字，君以反义词对另一诗。');
  await typeWrite('共四境：简单、普通、困难、地狱。每境十题，答对得十分。');

  const di = await showButtons(['[1] 简单','[2] 普通','[3] 困难','[4] 地狱']);
  const 难度 = ['简单','普通','困难','地狱'][di];

  let 待出题 = shuffle(题库[难度]);
  let 锦囊 = {透字:1, 换题:1, 半句:1};
  let 得分=0, 答对数=0, 跳过数=0, 序号=1;
  let 首题已答=false;

  while (序号<=10 && 待出题.length>0) {
    const 题 = 待出题.pop();
    const 显示句 = 题.原句.replace(题.关键词, '<span class="keyword">' + 题.关键词 + '</span>');

    clearContent();
    addText('第' + 大写数字[序号-1] + '题 · ' + 难度);
    addDivider();
    addPoemLine('出句：' + 显示句);
    addText('隐字：' + 题.关键词);
    addText('对字：' + 题.反义词);

    const 动作 = await showButtons([
      '[1] 提笔作答',
      '[2] 且听下题（跳过）',
      '[3] 使用锦囊（剩' + (锦囊.透字+锦囊.换题+锦囊.半句) + '次）'
    ]);

    if (动作===1) {
      跳过数++;
      成就.累计跳过++;
      addText('此题跳过。');
      await sleep(300);
      序号++; continue;
    }

    if (动作===2) {
      const ji = await showButtons([
        锦囊.透字>0?'[1] 透字（显答案首字）':'[1] 透字（已用尽）',
        锦囊.换题>0?'[2] 换题（换一题同境之题）':'[2] 换题（已用尽）',
        锦囊.半句>0?'[3] 半句（显答案半句）':'[3] 半句（已用尽）',
        '[0] 不用了'
      ]);

      if (ji===0 && 锦囊.透字>0) {
        锦囊.透字--; 成就.锦囊使用.透字++;
        addText('【透字】首字为：「' + 题.答案[0][0] + '」', 'tag tag-jin');
      } else if (ji===1 && 锦囊.换题>0 && 待出题.length>0) {
        锦囊.换题--; 成就.锦囊使用.换题++;
        待出题.push(题);
        continue; // 重新取题
      } else if (ji===2 && 锦囊.半句>0) {
        锦囊.半句--; 成就.锦囊使用.半句++;
        const 句 = 题.答案[0];
        const 半 = Math.random()<0.5 ? '「' + 句.slice(0,Math.floor(句.length/2)) + '……」' : '「……' + 句.slice(Math.floor(句.length/2)) + '」';
        addText('【半句】' + 半, 'tag tag-jin');
      }
    }

    const 用户答案 = await showInput('请对：');
    const 结果 = 检查答案(用户答案, 题.答案, 题.反义词);

    if (结果==='对') {
      addText('妙哉！正是此句。', 'correct');
      let 本题得分 = 10;
      if (!首题已答 && 当前增益.首题加分) {
        本题得分 = 15;
        addText('【青衫加持】首题 +15 分', 'tag tag-jin');
      } else {
        addText('+10 分', 'correct');
      }
      得分 += 本题得分;
      答对数++;
      首题已答 = true;
      诗囊.push('「' + 题.原句 + '」→「' + 用户答案 + '」');
    } else {
      addText('惜哉，非也。', 'wrong');
      addText('正解：' + 题.答案.slice(0,2).join(' / '));
      错题本.push(题);
    }

    await sleep(400);
    序号++;
  }

  成就.游戏次数++;
  成就.最高得分 = Math.max(成就.最高得分, 得分);
  成就.累计答对 += 答对数;
  if (难度==='地狱') 成就.地狱通关++;
  最后战绩 = {模式:'单人', 得分, 难度, 答对:答对数, 跳过:跳过数};

  clearContent();
  addText('试毕 · 榜文', 'subtitle');
  addText('得分：' + 得分 + ' / 100');
  addText('答对：' + 答对数 + ' 题');
  addText('跳过：' + 跳过数 + ' 题');

  if (得分===100) addText('才高八斗，冠绝全场！', 'correct');
  else if (得分>=80) addText('文采斐然，堪称才子！');
  else if (得分>=60) addText('中规中矩，尚可精进。');
  else if (得分>=30) addText('初窥门径，勤加练习。');
  else addText('任重道远，勿怠勿懈。');

  await showButtons(['【继续】']);

  if (错题本.length>0) {
    clearContent();
    await typeWrite('错题回廊尚开，可愿一访？');
    const yi = await showButtons(['[1] 愿往','[2] 且去']);
    if (yi===0) await 错题回廊();
  }

  诗友尺素();
  await sleep(200);
  章节选择界面();
}

function 匹配度计算(诗句, 客人) {
  let 分 = 0, 偏好命中 = 0;
  for (let 字 of 客人.偏好) if (诗句.includes(字)) 偏好命中++;
  分 += 偏好命中 * 12;

  const 惆怅词 = ['愁','泪','孤','寒','秋','暮','别','死','冷','凄','悲','伤'];
  const 淡然词 = ['空','静','闲','幽','远','深','石','松','禅','无','淡'];
  const 期许词 = ['春','花','燕','归','梦','暖','青','笑','生','新','绿'];
  let 诗境 = '';
  for (let 字 of 诗句) {
    if (惆怅词.includes(字)) { 诗境='惆怅'; break; }
    if (淡然词.includes(字)) { 诗境='淡然'; break; }
    if (期许词.includes(字)) { 诗境='期许'; break; }
  }
  if (诗境===客人.心境) 分 += 30;
  else if (诗境!=='') 分 += 10;
  if (诗句.length===5) 分 += 5;
  else if (诗句.length>=7) 分 += 8;
  return Math.min(分, 100);
}

function 评语生成(匹配度, 客人) {
  if (匹配度>=85) return rand(['妙极！此句正是我心中所想！','好句！当浮一大白！','得此一句，不虚此行！']);
  if (匹配度>=60) return rand(['尚可，有几分意思。','嗯……勉强入耳。','不差，但未尽意。']);
  if (匹配度>=40) return rand(['似乎……不太对味。','客官，这茶有点涩啊。','非我所求。']);
  return rand(['这……怕是拿错茶单了？','摇头叹息，无言以对。','罢了，饮茶吧。']);
}

  if (总分===3) {
    await typeWrite('铁案如山！君之推理，堪比狄公。');
    await typeWrite(案件.真相);
    成就.诗案侦破++;
    茶楼.声望 += 20;
    addText('【声望】+20', 'correct');
  } else if (总分>=2) {
    await typeWrite('大体不差，细节尚有可商。');
    await typeWrite(案件.真相);
    茶楼.声望 += 10;
    addText('【声望】+10');
  } else {
    await typeWrite('证据不足，真凶脱逃。');
    await typeWrite('此案……悬了。');
  }

  await showButtons(['【封卷】']);
}

// ==================== 启动 ====================
window.onload = function() {
  启动();
};
</script>
