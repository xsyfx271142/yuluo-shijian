function showButtons(labels, options={}) {
  return new Promise(resolve => {
    const group = document.createElement('div'); group.className = 'btn-group fade-in';
    if (options.id) group.id = options.id;
    labels.forEach((label, i) => {
      const btn = document.createElement('button'); btn.className = 'btn' + (options.primary===i?' btn-primary':'');
      btn.textContent = label; btn.onclick = () => { group.remove(); resolve(i); };
      group.appendChild(btn);
    });
    $('content').appendChild(group);
    if (options.autoFocus !== false) setTimeout(()=>group.querySelector('button')?.focus(), 50);
  });
}

function showInput(promptText) {
  return new Promise(resolve => {
    const wrap = document.createElement('div'); wrap.className = 'input-line fade-in';
    const span = document.createElement('span'); span.textContent = promptText || '▶ '; wrap.appendChild(span);
    const input = document.createElement('input'); input.type = 'text'; input.autocomplete = 'off'; wrap.appendChild(input);
    const btn = document.createElement('button'); btn.className = 'btn btn-primary'; btn.textContent = '确认';
    btn.onclick = () => { wrap.remove(); resolve(input.value.trim()); }; wrap.appendChild(btn);
    input.onkeydown = (e) => { if (e.key==='Enter') btn.click(); };
    $('content').appendChild(wrap); setTimeout(()=>input.focus(), 50);
  });
}

function 模糊匹配(用户输入, 标准答案, 阈值=0.6) {
  const m=用户输入.length, n=标准答案.length;
  if (m===0 || n===0) return false;
  const dp=Array(m+1).fill(0).map(()=>Array(n+1).fill(0));
  for (let i=1;i<=m;i++) for (let j=1;j<=n;j++) {
    dp[i][j] = 用户输入[i-1]===标准答案[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j],dp[i][j-1]);
  }
  return dp[m][n]/Math.max(m,n) >= 阈值;
}

function 检查答案(用户输入, 标准答案列表, 反义词) {
  用户输入 = 用户输入.trim();
  if (!用户输入 || 用户输入.length<2) return '错';
  for (let 答案 of 标准答案列表) {
    if (答案.includes(用户输入) || 用户输入.includes(答案)) return '对';
    if (模糊匹配(用户输入, 答案)) return '对';
  }
  // 兜底：含反义词且像一句诗（长度适中、用字不重复堆砌，防止「白白白白白」蒙对）
  if (用户输入.includes(反义词) && 用户输入.length>=5 && 用户输入.length<=14 && new Set(用户输入).size>=4) return '对';
  return '错';
}

function 节气判定() {
  const now = new Date();
  const m = now.getMonth() + 1, d = now.getDate();
  if (m===2 && d===4) return ['立春', '东风解冻，蛰虫始振。'];
  if (m===4 && d>=4 && d<=6) return ['清明', '清明时节雨纷纷，路上行人欲断魂。'];
  if (m===5 && d===5) return ['端午', '不效艾符趋习俗，但祈蒲酒话升平。'];
  if (m===8 && d===15) return ['中秋', '但愿人长久，千里共婵娟。'];
  if (m===1 && d===1) return ['元旦', '爆竹声中一岁除，春风送暖入屠苏。'];
  if (m===12 && d>=21 && d<=23) return ['冬至', '天时人事日相催，冬至阳生春又来。'];
  if (m===2 && d>=14 && d<=15) return ['元宵', '月上柳梢头，人约黄昏后。'];
  if (m===7 && d===7) return ['七夕', '两情若是久长时，又岂在朝朝暮暮。'];
  if (m===9 && d===9) return ['重阳', '遥知兄弟登高处，遍插茱萸少一人。'];
  return [null, null];
}

    if (动作===2) {
      const ji = await showButtons([

      else if (ji===1 && 锦囊.换题>0 && 待出题.length>0) { 锦囊.换题--; 成就.锦囊使用.换题++; 待出题.push(题); continue; }

function 茶楼状态栏() {
  const d = document.createElement('div');
  d.className = 'status-bar fade-in';
  d.innerHTML = '【' + 茶楼.店名 + '】 等级：' + 茶楼.等级 + '<br>铜钱：' + 茶楼.铜钱 + '　声望：' + 茶楼.声望 + '<br>今日迎客：' + 茶楼.今日迎客 + '　满意度：' + 茶楼.满意度;
  $('content').appendChild(d);
}

function 匹配度计算(诗句, 客人) {
  let 分 = 0;
  let 偏好命中 = 0;
  for (let 字 of 客人.偏好) if (诗句.includes(字)) 偏好命中++;
  分 += 偏好命中 * 18;

  // 心境匹配：统计诗句中各心境字数，取主导心境（原算法只取第一个命中字，大量诗句判不出心境）
  const 惆怅词 = ['愁','泪','孤','寒','秋','暮','别','死','冷','凄','悲','伤','月','雨','乡','雁','旧','晚'];
  const 淡然词 = ['空','静','闲','幽','远','深','石','松','禅','无','淡','山','水','云','眠'];
  const 期许词 = ['春','花','燕','归','梦','暖','青','笑','生','新','绿','晓','明','鹭','晴'];
  const 计数 = {惆怅:0, 淡然:0, 期许:0};
  for (let 字 of 诗句) {
    if (惆怅词.includes(字)) 计数.惆怅++;
    else if (淡然词.includes(字)) 计数.淡然++;
    else if (期许词.includes(字)) 计数.期许++;
  }
  let 诗境 = '', 最多 = 0;
  for (let m of ['惆怅','淡然','期许']) if (计数[m] > 最多) { 最多 = 计数[m]; 诗境 = m; }
  if (诗境 === 客人.心境) 分 += 40;
  else if (诗境 !== '') 分 += 15;

  if (诗句.length === 5) 分 += 6;
  else if (诗句.length >= 7) 分 += 10;

  if (入室弟子.size > 0) 分 += 10; // v1.2 入室弟子替你守茶楼
  return Math.min(分, 100);
}

function 评语生成(匹配度, 客人) {
  let 池;
  if (匹配度 >= 85) 池 = ['妙极！此句正是我心中所想！', '好句！当浮一大白！', '得此一句，不虚此行！'];
  else if (匹配度 >= 60) 池 = ['尚可，有几分意思。', '嗯……勉强入耳。', '不差，但未尽意。'];
  else if (匹配度 >= 40) 池 = ['似乎……不太对味。', '客官，这茶有点涩啊。', '非我所求。'];
  else 池 = ['这……怕是拿错茶单了？', '（摇头叹息，无言以对）', '罢了，饮茶吧。'];
  return rand(池);
}

async function 对客投壶() {
  标题('对客投壶 · 奉茶');

  addText('【来客】' + 客.名);

  const 可用 = [...new Set([...诗囊, ...茶单])];
  if (!可用.length) { await typeWrite('茶单空空，无从奉茶……'); await showButtons(['【退下】']); return; }

  await typeWrite('君可从茶单中选一句奉客：');
  const 展示 = 可用.slice(0, 9);
  const labels = 展示.map((s, i) => '[' + (i+1) + '] ' + s);
  labels.push('[0] 暂不奉茶');
  const i = await showButtons(labels);
  if (i === 展示.length) { await typeWrite('客官稍候，待我温一壶新茶……'); await sleep(400); return; }

  const 诗句 = 展示[i];
  await typeWrite('君奉上一句：「' + 诗句 + '」');
  await sleep(300);

  const 匹配 = 匹配度计算(诗句, 客);
  const 赏钱 = Math.floor(客.基准 * 匹配 / 100);
  const 声望 = Math.floor(匹配 / 100 * 5);
  addNpcTalk(客.名, 评语生成(匹配, 客));

  if (匹配 >= 85) {
    addText('【金玉良缘】赏钱 +' + 赏钱 + ' 声望 +' + 声望, 'correct');
    茶楼.铜钱 += 赏钱; 茶楼.声望 += 声望;
    茶楼.满意度 = Math.min(100, 茶楼.满意度 + 5);
    if (!诗囊.includes(诗句)) { 诗囊.push(诗句); addText('【诗囊】客人将此句题于壁上，已收录。'); }
  } else if (匹配 >= 60) {
    addText('【差强人意】赏钱 +' + 赏钱 + ' 声望 +' + 声望, 'correct');
    茶楼.铜钱 += 赏钱; 茶楼.声望 += 声望;
  } else {
    addText('【拂袖而去】赏钱 +' + Math.max(1, Math.floor(赏钱 / 2)), 'wrong');
    茶楼.铜钱 += Math.max(1, Math.floor(赏钱 / 2));
    茶楼.满意度 = Math.max(0, 茶楼.满意度 - 5);
  }
  茶楼.今日迎客++; 茶楼.累计迎客++;
  // 若来客本就是诗友名录中人（如「醉翁」），亲密度 +2
  if (客.名 in 诗友亲密度) {
    诗友亲密度[客.名] = Math.min(100, 诗友亲密度[客.名] + 2);
    if (诗友亲密度[客.名] >= 100 && !入室弟子.has(客.名)) {
      入室弟子.add(客.名);
      addText('【' + 客.名 + '】亲密度已满，愿拜你为师，成为入室弟子！（茶楼奉茶匹配度 +10）', 'correct');
    }
  }
  await showButtons(['【送客】']);
}

async function 勘查现场(案件) {

function 判来源(句) {
  if (句.startsWith('回廊')) return '错题回廊';
  if (句.startsWith('飞花令')) return '飞花令';
  if (句.includes('→')) return '反义对诗';
  if (句.includes('，')) return '残卷古籍';
  return '茶楼雅事';
}

async function 诗囊图鉴界面() {
  const 主题表 = ['风','花','雪','月','春','夏','秋','冬','山','水','雨','云','酒','愁','归','夜'];
  while (true) {
    标题('诗囊图鉴 · 分类览');
    if (!诗囊.length) {
      await typeWrite('囊空如洗，尚无只字。去玩几局雅戏，或经营茶楼，皆可收句。');
      await showButtons(['【退至主阁】']); 主阁(); return;
    }
    await typeWrite('共收录 ' + 诗囊.length + ' 句，按十六主题归类：');
    const labels = 主题表.map((t, i) => '[' + (i+1) + '] ' + t + '（' + 诗囊.filter(句 => 句.includes(t)).length + '）');
    labels.push('[0] 退至主阁');
    const i = await showButtons(labels);
    if (i === 主题表.length) { 主阁(); return; }
    const t = 主题表[i];
    标题('诗囊图鉴 · 「' + t + '」类');
    let 数 = 0;
    诗囊.forEach((句, idx) => {
      if (句.includes(t)) {
        数++;
        addText('· ' + 句);
        const 录 = 诗囊记录[idx];
        addText('　来源：' + 判来源(句) + (录 ? '　收录于 ' + 录.时 : ''), 'subtitle');
      }
    });
    if (数 === 0) await typeWrite('此类尚无收录。');
    await showButtons(['【返回图鉴】']);
  }
}

  if (m===2 && d===4) { 节气='立春'; 签文='东风解冻，蛰虫始振。'; }
  else if (m===4 && d>=4 && d<=6) { 节气='清明'; 签文='清明时节雨纷纷，路上行人欲断魂。'; }
  else if (m===5 && d===5) { 节气='端午'; 签文='不效艾符趋习俗，但祈蒲酒话升平。'; }
  else if (m===8 && d===15) { 节气='中秋'; 签文='但愿人长久，千里共婵娟。'; }
  else if (m===1 && d===1) { 节气='元旦'; 签文='爆竹声中一岁除，春风送暖入屠苏。'; }
  else if (m===12 && d>=21 && d<=23) { 节气='冬至'; 签文='天时人事日相催，冬至阳生春又来。'; }
  else if (m===2 && d>=14 && d<=15) { 节气='元宵'; 签文='月上柳梢头，人约黄昏后。'; }
  else if (m===7 && d===7) { 节气='七夕'; 签文='两情若是久长时，又岂在朝朝暮暮。'; }
  else if (m===9 && d===9) { 节气='重阳'; 签文='遥知兄弟登高处，遍插茱萸少一人。'; }
  if (节气) {
    addText('【节气】' + 节气);
    await typeWrite(签文);
  } else {
    addText('【节气】今日无特殊节气');
  }
  const 时 = getHour();
  addText('【时辰】' + 时 + '时');
  addText('【时签】' + rand(时辰签[时]));
  await typeWrite(时辰引[时]);
  addText('【心境】' + 心境);
  const 文案 = {惆怅:'烟雨迷蒙，心事如织。',淡然:'云卷云舒，去留无意。',期许:'晨光熹微，万物可期。'};
  await typeWrite(文案[心境]);
  await showButtons(['【退下】']);
}

// 公告板主界面
async function 公告板() {
  while (true) {
    存档();
    空行(1);
    标题('听雨轩 · 公告板', '═');
    await typeWrite('此处张贴更新、传闻、运势与留言。');
    // 显示最新公告
    const 最新 = 更新日志[更新日志.length-1];
    addText('【最新公告 | ' + 最新.日期 + ' ' + 最新.版本 + '】');
    for (let 条目 of 最新.内容.slice(-2)) addText('  · ' + 条目);
    const i = await showButtons([
      '[1] 诗谶求签 · 每日运势',
      '[2] 江湖传闻 · 小道消息',
      '[3] 版本志 · 玩法详解与更新历史',
      '[4] 彩蛋墙 · 隐藏内容提示',
      '[5] 留言墙 · 诗友题字',
      '[6] 天时 · 时令与气象',
      '[7] 诗友名录 · 亲密度查看',
      '[0] 退至主阁'
    ]);
    if (i===7) break;
    if (i===0) await 诗谶求签();
    else if (i===1) await 江湖传闻();
    else if (i===2) await 版本志();
    else if (i===3) await 彩蛋墙();
    else if (i===4) await 留言墙();
    else if (i===5) await 天气时令联动();
    else if (i===6) {
      空行(1);
      标题('诗友名录 · 亲密度', '═');
      const sorted = Object.entries(诗友亲密度).sort((a,b)=>b[1]-a[1]);
      for (let [名, 值] of sorted) {
        const 状态 = 入室弟子.has(名) ? '【入室弟子】' : '';
        const bar = '█'.repeat(Math.floor(值/10)) + '░'.repeat(10-Math.floor(值/10));
        addText(名 + '：' + bar + ' ' + 值 + '/100 ' + 状态);
      }
      await showButtons(['【退下】']);
    }
  }
  主阁();
}

// ==================== 选择心境 ====================
async function 选择心境() {
  clearContent();
  await typeWrite('调弦...');
  addText('此刻心境如何？');
  const i = await showButtons(['[1] 惆怅','[2] 淡然','[3] 期许']);
  心境 = ['惆怅','淡然','期许'][i];
  const 文案 = {惆怅:'烟雨迷蒙，心事如织。',淡然:'云卷云舒，去留无意。',期许:'晨光熹微，万物可期。'};
  addText(文案[心境]);
  await sleep(300);
  主阁();
}

// ==================== 统一收尾 ====================
async function 统一收尾() {
  clearContent();
  addDivider();
  await typeWrite('罢了……');
  await typeWrite('风未起，茶尚温，');
  await typeWrite('这一页暂且留白。');
  await typeWrite('且将心事付瑶琴，');
  await typeWrite('弦断有谁听……');
  await typeWrite('未完待续，');
  await typeWrite('敬请期待。');
  addDivider();
  const 尾选 = await showButtons(['【再入听雨轩】','【焚稿重来 · 清除存档】'], {primary:0});
  if (尾选===1) { localStorage.removeItem(存档键); location.reload(); return; }
  启动();
}
