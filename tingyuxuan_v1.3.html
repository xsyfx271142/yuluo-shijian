// ==================== 工具函数 ====================
function $(id) { return document.getElementById(id); }
function rand(arr) { return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(arr) { return arr.slice().sort(()=>Math.random()-0.5); }
function getHour() { const h = new Date().getHours(); if (h>=5 && h<11) return '晨'; if (h>=11 && h<17) return '午'; if (h>=17 && h<21) return '暮'; return '夜'; }

async function typeWrite(text, speed=40) {
  const el = document.createElement('div');
  el.className = 'type-text fade-in';
  $('content').appendChild(el);
  for (let i=0; i<text.length; i++) {
    el.textContent += text[i];
    await sleep(speed * (心境==='惆怅'?1.5:心境==='期许'?0.8:1));
  }
  return el;
}
function sleep(ms) { return new Promise(r=>setTimeout(r,ms)); }
function clearContent() { $('content').innerHTML = ''; }
function addDivider() { const d = document.createElement('div'); d.className = 'divider'; d.textContent = '──────────'; $('content').appendChild(d); }
function addText(text, cls='') { const d = document.createElement('div'); d.className = 'type-text fade-in' + (cls?' '+cls:''); d.textContent = text; $('content').appendChild(d); return d; }
function addPoemLine(text) { const d = document.createElement('div'); d.className = 'poem-line fade-in'; d.innerHTML = text; $('content').appendChild(d); return d; }
function addNpcTalk(name, text) { const d = document.createElement('div'); d.className = 'npc-talk fade-in'; d.innerHTML = '<strong>【' + name + '】</strong>「' + text + '」'; $('content').appendChild(d); return d; }

function showButtons(labels, options={}) {
  return new Promise(resolve => {
    const group = document.createElement('div'); group.className = 'btn-group fade-in';
    if (options.id) group.id = options.id;
    labels.forEach((label, i) => {
      const btn = document.createElement('button'); btn.className = 'btn' + (options.primary===i?' btn-primary':'');
      btn.textContent = label; btn.onclick = () => { group.remove(); resolve(i); };
      group.appendChild(btn);
    });
    $('content').appendChild(group);
    if (options.autoFocus !== false) setTimeout(()=>group.querySelector('button')?.focus(), 50);
  });
}

function showInput(promptText) {
  return new Promise(resolve => {
    const wrap = document.createElement('div'); wrap.className = 'input-line fade-in';
    const span = document.createElement('span'); span.textContent = promptText || '▶ '; wrap.appendChild(span);
    const input = document.createElement('input'); input.type = 'text'; input.autocomplete = 'off'; wrap.appendChild(input);
    const btn = document.createElement('button'); btn.className = 'btn btn-primary'; btn.textContent = '确认';
    btn.onclick = () => { wrap.remove(); resolve(input.value.trim()); }; wrap.appendChild(btn);
    input.onkeydown = (e) => { if (e.key==='Enter') btn.click(); };
    $('content').appendChild(wrap); setTimeout(()=>input.focus(), 50);
  });
}

function 模糊匹配(用户输入, 标准答案, 阈值=0.6) {
  const m=用户输入.length, n=标准答案.length;
  if (m===0 || n===0) return false;
  const dp=Array(m+1).fill(0).map(()=>Array(n+1).fill(0));
  for (let i=1;i<=m;i++) for (let j=1;j<=n;j++) {
    dp[i][j] = 用户输入[i-1]===标准答案[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j],dp[i][j-1]);
  }
  return dp[m][n]/Math.max(m,n) >= 阈值;
}

function 检查答案(用户输入, 标准答案列表, 反义词) {
  用户输入 = 用户输入.trim();
  if (!用户输入 || 用户输入.length<2) return '错';
  for (let 答案 of 标准答案列表) {
    if (答案.includes(用户输入) || 用户输入.includes(答案)) return '对';
    if (模糊匹配(用户输入, 答案)) return '对';
  }
  if (用户输入.includes(反义词) && 用户输入.length>4) return '对';
  return '错';
}

function 检查解锁() {
  if (成就.游戏次数>=1) 已解锁.add('其二');
  if (成就.最高得分>=60) 已解锁.add('其三');
  if (成就.人机胜场>=1) 已解锁.add('其四');
  if (成就.锦囊使用.透字>=1 && 成就.锦囊使用.换题>=1 && 成就.锦囊使用.半句>=1) 已解锁.add('其五');
  if (成就.累计答对>=10) 已解锁.add('其六');
  if (成就.回廊答对>=5) 已解锁.add('其七');
  if (成就.地狱通关>=1) 已解锁.add('其八');
  if (成就.累计跳过>=20) 已解锁.add('其九');
  if (已解锁.size>=9) 已解锁.add('其十');
}

      if (结果==='对') { addText('妙哉！正是此句。', 'correct'); addText('你 +10 分', 'correct'); 玩家得分 += 10; 玩家答对++; 诗囊.push('「' + 题.原句 + '」→「' + 用户答案 + '」'); }

  await typeWrite('错处亦是风景，可愿重走一回？');

  for (let 题 of 待温习) {
    const 显示句 = 题.原句.replace(题.关键词, '<span class="keyword">' + 题.关键词 + '</span>');
    clearContent(); addText('旧题：' + 显示句); addText('对字：' + 题.反义词);
    const 选 = await showButtons(['[1] 提笔再试','[2] 退出回廊']);
    if (选===1) { 错题本.push(题); continue; }
    const 用户答案 = await showInput('请对：');
    const 结果 = 检查答案(用户答案, 题.答案, 题.反义词);
    if (结果==='对') { addText('旧雨重逢，别有一番滋味。', 'correct'); 回廊对++; 诗囊.push('回廊「' + 题.原句 + '」→「' + 用户答案 + '」'); }
    else { addText('此题依旧难解，留待日后。', 'wrong'); addText('正解：' + 题.答案.slice(0,2).join(' / ')); 错题本.push(题); }
    await sleep(300);
  }
  成就.回廊答对 += 回廊对;
  clearContent();
  if (错题本.length===0) addText('回廊已尽，前尘皆过。', 'correct');
  else addText('回廊尚有 ' + 错题本.length + ' 盏残灯，改日再访。');
  addText('本次回廊答对：' + 回廊对 + ' 题');
  await showButtons(['【退出】']);
}

async function 诗友尺素() {

  await typeWrite('案上有一封未署名的信，似是留给你的……');
  let 信 = '';
  const {模式, 得分, 结果} = 最后战绩;
  if (模式==='飞花令') 信 = 结果==='胜'?'飞花令上，君才思敏捷，某甘拜下风。':'飞花令虽败，然诗词之道，贵在积累。';
  else if (模式==='人机') 信 = 结果==='胜'?'手谈十局，君胜一筹。他日备酒，再讨教高招。':(结果==='负'?'惜哉，AI险胜半子。君子不耻下问。':'十局终了，旗鼓相当。棋逢对手，人生快事。');
  else if (模式==='单人') {
    if (得分===100) 信 = '满分！君之才情，令某自惭形秽。附赠一壶桂花酿。';
    else if (得分>=80) 信 = '捌拾分以上，文采斐然。再接再厉。';
    else if (得分>=60) 信 = '中规中矩，尚可精进。诗路漫漫，莫停蹄。';
    else 信 = '任重道远，勿怠勿懈。勤能补拙。';
  } else if (模式==='残卷') {
    信 = 得分>=80?'残卷修复八九成，君之记忆力，某佩服。':(得分>=50?'残卷修复过半，尚有墨迹待补。':'残卷破损严重，莫灰心。');
  }
  addText('「' + 信 + '」', 'npc-talk'); addText('——无名氏 顿首');
  await showButtons(['【火漆封口】']);
}

// 诗谶求签
async function 诗谶求签() {
  空行(2);
  标题('诗谶求签 · 问卜', '═');
  if (今日已求签) {
    await typeWrite('今日已求过一签，天机不可再泄。');
    await typeWrite('明日再来吧。');
    await showButtons(['【退下】']);
    return;
  }
  今日已求签 = true;
  await typeWrite('焚香净手，摇签筒……');
  await sleep(500);
  const 签等 = rand(['上签','中签','下签']);
  const 签文 = rand(签文库[签等]);
  addText('【' + 签等 + '】');
  await typeWrite('签文：「' + 签文.签 + '」');
  await typeWrite('批语：' + 签文.批);
  if (签等 === '下签') {
    await typeWrite('凶签当前，可愿以诗解厄？');
    const 选 = await showButtons(['[1] 以诗解厄（答对一题化解）','[2] 暂且记下，他日再解']);
    if (选 === 0) {
      const 题 = rand(题库['简单']);
      await typeWrite('解厄之题：' + 题.原句.replace(题.关键词, '_' + 题.关键词 + '_'));
      await typeWrite('对字：' + 题.反义词);
      const 答 = await showInput('请对：');
      if (检查答案(答, 题.答案, 题.反义词) === '对') {
        await typeWrite('妙哉！凶煞已解，转祸为福。');
        addText('【解厄奖励】铜钱 +20', 'correct');
      } else {
        await typeWrite('惜哉，解厄未成。今日宜静不宜动。');
      }
    }
  } else if (签等 === '上签') {
    await typeWrite('吉签在手，可愿以诗酬神？');
    const 选 = await showButtons(['[1] 以诗酬神（分享一句诗积福）','[2] 心领神会，不必多言']);
    if (选 === 0) {
      const 诗句 = await showInput('请献一句心头好诗：');
      if (诗句.length >= 5) {
        await typeWrite('「' + 诗句 + '」——好句！神已笑纳。');
        addText('【酬神奖励】声望 +5', 'correct');
        if (!诗囊.includes(诗句)) 诗囊.push(诗句);
      } else {
        await typeWrite('此句太短，神嫌不够诚意。');
      }
    }
  } else {
    await typeWrite('中签平稳，无大喜亦无大忧。');
    await typeWrite('今日宜按部就班，稳中求进。');
  }
  await showButtons(['【退下】']);
}

// 天时
async function 天气时令联动() {
  空行(2);
  标题('天时 · 时令与气象', '═');
  const now = new Date();
  const m = now.getMonth() + 1, d = now.getDate();
  let 节气 = null, 签文 = null;
  if (m===2 && d===4) { 节气='立春'; 签文='东风解冻，蛰虫始振。'; }
  else if (m===4 && d>=4 && d<=6) { 节气='清明'; 签文='清明时节雨纷纷，路上行人欲断魂。'; }
  else if (m===5 && d===5) { 节气='端午'; 签文='不效艾符趋习俗，但祈蒲酒话升平。'; }
  else if (m===8 && d===15) { 节气='中秋'; 签文='但愿人长久，千里共婵娟。'; }
  else if (m===1 && d===1) { 节气='元旦'; 签文='爆竹声中一岁除，春风送暖入屠苏。'; }
  else if (m===12 && d>=21 && d<=23) { 节气='冬至'; 签文='天时人事日相催，冬至阳生春又来。'; }
  else if (m===2 && d>=14 && d<=15) { 节气='元宵'; 签文='月上柳梢头，人约黄昏后。'; }
  else if (m===7 && d===7) { 节气='七夕'; 签文='两情若是久长时，又岂在朝朝暮暮。'; }
  else if (m===9 && d===9) { 节气='重阳'; 签文='遥知兄弟登高处，遍插茱萸少一人。'; }
  if (节气) {
    addText('【节气】' + 节气);
    await typeWrite(签文);
  } else {
    addText('【节气】今日无特殊节气');
  }
  const 时 = getHour();
  addText('【时辰】' + 时 + '时');
  addText('【时签】' + rand(时辰签[时]));
  await typeWrite(时辰引[时]);
  addText('【心境】' + 心境);
  const 文案 = {惆怅:'烟雨迷蒙，心事如织。',淡然:'云卷云舒，去留无意。',期许:'晨光熹微，万物可期。'};
  await typeWrite(文案[心境]);
  await showButtons(['【退下】']);
}
